<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arabic Letter Island</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#bfe9ff">
<style>
:root{--i:#3b2f63;--p:#ff7a59}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#bfe9ff,#fff8e7);color:var(--i);min-height:100vh}
header{display:flex;justify-content:space-between;padding:10px 14px;font-size:1.1rem}
nav{display:flex;gap:6px;padding:4px 8px;justify-content:center;flex-wrap:wrap}
button,select{font:inherit;border:0;border-radius:16px;padding:10px 14px;background:var(--p);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #0002}
select{background:#fff;color:var(--i)}
button:active{transform:translateY(3px)}
.ar{font-family:'Noto Naskh Arabic','Amiri','Scheherazade New','Segoe UI','Geeza Pro',serif;direction:rtl}
#m{max-width:720px;margin:auto;padding:12px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl;margin-top:10px}
.t{background:#fff;color:var(--i);font-size:2.4rem;padding:6px}
.big{font-size:6rem;line-height:1.4}
.cat{font-size:4rem;animation:b 1.6s infinite}
@keyframes b{50%{transform:translateY(-10px) rotate(-6deg)}}
.w{display:inline-block;animation:w 2.4s linear both}
@keyframes w{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
.pop{animation:p .35s}
@keyframes p{from{transform:scale(.2)}}
.box{display:inline-block;min-width:64px;height:78px;line-height:78px;border:3px dashed var(--i);border-radius:14px;margin:4px;font-size:2.6rem;background:#fff}
.sh{animation:s .3s}
@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.f{position:fixed;font-size:2rem;pointer-events:none;animation:f 1.2s ease-out forwards}
@keyframes f{to{transform:translateY(-200px) rotate(360deg);opacity:0}}
.snap{animation:sn .5s}@keyframes sn{40%{transform:scale(1.08)}}
.card{animation:sl .5s}@keyframes sl{from{transform:translateX(120%)}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;padding:12px 16px;border-radius:16px;box-shadow:0 4px 12px #0003}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><b>🐱 Arabic Letter Island</b><span id="st">⭐ 0</span></header>
<nav id="nav"></nav>
<main id="m"></main>
<script>
const Z="\u200D",$=s=>document.querySelector(s),m=$('#m');
const STEP=500; // ms between letters in the word builder
// [letter, name, sound, joinsToNext]
const L=[["ا","alif","aa",0],["ب","ba","b",1],["ت","ta","t",1],["ث","tha","th",1],["ج","jiim","j",1],["ح","Haa","H",1],["خ","khaa","kh",1],["د","daal","d",0],["ذ","dhaal","dh",0],["ر","raa","r",0],["ز","zayn","z",0],["س","siin","s",1],["ش","shiin","sh",1],["ص","Saad","S",1],["ض","Daad","D",1],["ط","Taa","T",1],["ظ","DHaa","DH",1],["ع","'ayn","'",1],["غ","ghayn","gh",1],["ف","fa","f",1],["ق","qaaf","q",1],["ك","kaaf","k",1],["ل","laam","l",1],["م","miim","m",1],["ن","nuun","n",1],["ه","ha","h",1],["و","waaw","w",0],["ي","ya","y",1]];
// [letter indexes, word, meaning, emoji]
const W=[[[15,0,22,1],"طالب","student","🎓"],[[1,27,2],"بيت","house","🏠"],[[21,2,0,1],"كتاب","book","📖"],[[1,0,1],"باب","door","🚪"],[[20,23,9],"قمر","moon","🌙"],[[24,1,2],"نبت","plant","🌱"],[[2,1,24],"تبن","hay","🌾"]];
let built=[];try{built=JSON.parse(localStorage.getItem("bt"))||[]}catch(e){}
function grow(k){if(!built.includes(k)){built.push(k);try{localStorage.setItem("bt",JSON.stringify(built))}catch(e){}}}
const COL=["#e63946","#2a9d8f","#f4a261","#6a4c93","#1d78c1","#e76f51"];
let stars=0,T=[];
try{stars=+localStorage.getItem('st')||0}catch(e){}
const later=(f,ms)=>T.push(setTimeout(f,ms));
function addStar(){stars++;try{localStorage.setItem('st',stars)}catch(e){}$('#st').textContent='⭐ '+stars}
function tts(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.7;speechSynthesis.speak(u)}catch(e){}}
// Plays audio/<id>.mp3 if it exists (recorded voice), otherwise falls back to browser TTS
function say(t,id){const a=new Audio('audio/'+id+'.mp3');a.play().catch(()=>tts(t))}
function boom(){for(let i=0;i<14;i++){const e=document.createElement('div');e.className='f';e.textContent=['🎉','⭐','✨','🌟'][i%4];e.style.left=Math.random()*90+'vw';e.style.top=60+Math.random()*30+'vh';document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}}
const snd=i=>(i==0?"أ":L[i][0])+"َ";
const frm=(i,p)=>[L[i][0],L[i][0]+Z,Z+L[i][0]+Z,Z+L[i][0]][p]; // isolated, initial, medial, final
function wf(ix,k){const pv=k>0&&L[ix[k-1]][3],nx=k<ix.length-1&&L[ix[k]][3];return(pv?Z:"")+L[ix[k]][0]+(nx?Z:"")}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

const S={
home(){m.innerHTML=`<div class=cat>🐱</div><h1>Arabic Letter Island</h1><p>Touch, hear, write and build Arabic letters and words with the cat!</p><button onclick="go('letters')">Start ▶</button>`},
letters(){
 m.innerHTML=`<h2>Touch a letter</h2><div id=sh class="big ar">🐱</div><div id=nm>&nbsp;</div><div class=grid>`+L.map((l,i)=>`<button class="t ar" data-i="${i}">${l[0]}</button>`).join('')+`</div>`;
 m.querySelector('.grid').onclick=e=>{let i=e.target.dataset.i;if(i==null)return;i=+i;
  $('#sh').innerHTML=`<span class=w>${L[i][0]}</span>`;
  $('#nm').innerHTML=`<b>${L[i][1]}</b> — “${L[i][2]}” <button onclick="go('forms',${i})">See its forms</button>`;
  say(snd(i),'l'+i)}},
forms(i=1){
 const j=L[i][3],N=['Isolated','Initial','Medial','Final'],lock=p=>!j&&(p==1||p==2);
 m.innerHTML=`<h2>Four forms</h2><select id=sel>${L.map((l,k)=>`<option value=${k} ${k==i?'selected':''}>${l[0]} ${l[1]}</option>`).join('')}</select> <button id=all>▶ Shape-shift all</button><div id=sh class="big ar">&nbsp;</div><div id=fb class=grid style="grid-template-columns:repeat(4,1fr)">`+N.map((n,p)=>`<button class="t ar" data-p=${p}>${lock(p)?'🔒':frm(i,p)}<br><small style="font:13px sans-serif">${n}</small></button>`).join('')+`</div>`;
 const show=p=>{if(lock(p)){$('#sh').textContent='🔒 Shy letter: it never joins the next letter!';return}
  $('#sh').innerHTML=`<span class=w>${frm(i,p)}</span>`;say(snd(i),'l'+i)};
 $('#sel').onchange=e=>go('forms',+e.target.value);
 $('#fb').onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.p)};
 $('#all').onclick=()=>{[0,1,2,3].forEach((p,n)=>later(()=>show(p),n*2800))}},
words(){
 m.innerHTML=`<h2>Pick a word</h2><div class=grid style="grid-template-columns:repeat(2,1fr)">`+W.map((w,k)=>`<button class=t data-k=${k}><span class=ar>${w[1]}</span><br><small style="font:14px sans-serif">${w[3]} ${w[2]}</small></button>`).join('')+`</div>`;
 m.querySelector('.grid').onclick=e=>{const b=e.target.closest('button');if(b)S.word(+b.dataset.k)}},
word(k){
 m.innerHTML=`<h2>${W[k][3]} ${W[k][2]}</h2><div id=out class="big ar" style="min-height:130px"></div><div id=info></div><button id=wb>▶ Watch</button> <button id=bb>🧱 Build it</button> <button id=fx>🔧 Fix it</button><div id=bd></div>`;
 $('#wb').onclick=()=>watch(k);$('#bb').onclick=()=>build(k);$('#fx').onclick=()=>fix(k)},
island(){m.innerHTML=`<h2>🏝️ My Island</h2><div class=cat>🐱</div><div style="font-size:3rem;min-height:120px">`+(built.length?built.map(k=>W[k][3]).join(' '):'Build words to grow your island!')+`</div><p>${built.length}/${W.length} words built</p>`},
toss(){
 const J=L.map((l,i)=>i).filter(i=>L[i][3]);
 const round=()=>{const i=J[Math.random()*J.length|0],p=Math.random()*4|0;
  m.innerHTML=`<h2>Where does the cat throw it?</h2><div class=cat>🐱⚽</div><div class="big ar">${frm(i,p)}</div><p>Pot = alone · Hens = start · Mouse = middle · House = end</p>`+[['🫕','Pot'],['🐔','Hens'],['🐭','Mouse'],['🏠','House']].map((t,q)=>`<button class=t data-q=${q}>${t[0]}<br><small style="font:14px sans-serif">${t[1]}</small></button>`).join(' ');
  m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
   if(+b.dataset.q==p){boom();addStar();say(snd(i),'l'+i);later(round,1200)}
   else{b.classList.add('sh');setTimeout(()=>b.classList.remove('sh'),400)}})};
 round()}};

function finish(k){$('#out').classList.add('snap');$('#info').innerHTML=`<div class=card><h3>${W[k][3]} ${W[k][1]} = ${W[k][2]}</h3></div>`;say(W[k][1],'w'+k);boom();addStar();grow(k);try{navigator.vibrate(60)}catch(e){}}
function fix(k){T.forEach(clearTimeout);T=[];const ix=W[k][0].slice(),q=Math.random()*ix.length|0,good=ix[q];let bad;do{bad=Math.random()*28|0}while(bad==good);ix[q]=bad;
 $('#info').textContent='One letter is wrong. Tap it!';$('#bd').innerHTML='';
 $('#out').innerHTML=ix.map((x,n)=>`<button class="t ar" data-n="${n}">${wf(ix,n)}</button>`).join('');
 $('#out').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(+b.dataset.n!=q){b.classList.add('sh');return}
  const o=shuf([good,bad,shuf(L.map((l,i)=>i).filter(i=>i!=good&&i!=bad))[0]]);$('#info').textContent='Pick the right letter';
  $('#bd').innerHTML=`<div class="grid ar">`+o.map(x=>`<button class="t ar" data-x=${x}>${L[x][0]}</button>`).join('')+`</div>`;
  $('#bd').onclick=f=>{const c=f.target.closest('button');if(!c)return;if(+c.dataset.x==good){$('#out').onclick=null;$('#bd').innerHTML='';const w=W[k][0];$('#out').innerHTML=w.map((y,n)=>`<span style="color:${COL[n%6]}">${wf(w,n)}</span>`).join('');finish(k)}else{c.classList.add('sh');say(snd(good),'l'+good)}}}}
function watch(k){
 T.forEach(clearTimeout);T=[];const ix=W[k][0],out=$('#out');out.innerHTML='';$('#info').innerHTML='';$('#bd').innerHTML='';
 ix.forEach((x,n)=>later(()=>{const s=document.createElement('span');s.className='pop';s.style.cssText=`color:${COL[n%6]};display:inline-block`;s.textContent=wf(ix,n);out.appendChild(s);say(snd(x),'l'+x);if(!L[x][3]&&n<ix.length-1)$('#info').textContent='🙈 Shy letter: it won’t hold hands!'},n*STEP));
 later(()=>finish(k),ix.length*STEP+500)}
function build(k){
 T.forEach(clearTimeout);T=[];const ix=W[k][0];let pos=0;
 const dec=shuf(L.map((l,i)=>i).filter(i=>!ix.includes(i))).slice(0,2);
 $('#out').innerHTML=ix.map(()=>`<span class=box></span>`).join('');$('#info').innerHTML='';
 $('#bd').innerHTML=`<div class="grid ar">`+shuf(ix.concat(dec)).map(x=>`<button class="t ar" data-x=${x}>${L[x][0]}</button>`).join('')+`</div>`;
 const bx=[...$('#out').children];
 $('#bd').onclick=e=>{const b=e.target.closest('button');if(!b||pos>=ix.length)return;const x=+b.dataset.x;
  if(x==ix[pos]){const c=bx[pos];c.textContent=wf(ix,pos);c.style.color=COL[pos%6];c.classList.add('pop');say(snd(x),'l'+x);b.style.visibility='hidden';pos++;
   if(pos==ix.length)later(()=>{$('#out').innerHTML=ix.map((y,n)=>`<span style="color:${COL[n%6]}">${wf(ix,n)}</span>`).join('');finish(k)},600)}
  else{const c=bx[pos];c.classList.add('sh');c.textContent='🤔';say(snd(ix[pos]),'l'+ix[pos]);later(()=>{c.classList.remove('sh');c.textContent=''},600)}}}

const NAV=[["home","🏠 Home"],["letters","🔤 Letters"],["forms","🧩 Forms"],["words","📖 Words"],["toss","🎯 Toss"],["island","🏝️ Island"]];
$('#nav').innerHTML=NAV.map(([k,t])=>`<button data-s="${k}">${t}</button>`).join('');
$('#nav').onclick=e=>{const s=e.target.dataset.s;if(s)go(s)};
function go(s,a){try{speechSynthesis.cancel()}catch(e){}T.forEach(clearTimeout);T=[];S[s](a)}
$('#st').textContent='⭐ '+stars;go('home');
setTimeout(()=>{const d=document.createElement('div');d.className='toast';d.textContent='🐱 Stretch break! 10 minutes played.';document.body.appendChild(d);setTimeout(()=>d.remove(),8000)},600000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
